
name: nusantaratv-bigdata

services:
  airflow-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
      - airflow_db_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standalone starts API server, scheduler, DAG processor and triggerer.
  # Intended for this local educational project.
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    restart: unless-stopped
    command: ["python", "/opt/project/config/start_airflow.py"]
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      PYTHONPATH: /opt/project
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-18080}:8080"
    volumes:
      - airflow_home:/opt/airflow
      - airflow_db_socket:/var/run/airflow-postgres
      - ./dags:/opt/project/dags:ro
      - ./src:/opt/project/src:ro
      - ./config:/opt/project/config:ro
      - ./sql:/opt/project/sql:ro
      - ./data:/opt/project/data
    depends_on:
      airflow-db:
        condition: service_healthy


volumes:
  airflow_db_data:
  airflow_db_socket:
  airflow_home:
